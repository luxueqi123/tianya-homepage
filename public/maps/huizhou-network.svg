      <stop stop-color="#071013"/>
      <stop offset=".48" stop-color="#0b1114"/>
      <stop offset="1" stop-color="#12100d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#78ceb1" stop-opacity=".19"/>
      <stop offset="1" stop-color="#78ceb1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
