# BEGIN TIANYA HOMEPAGE
server {
    listen 80;
    server_name my.tianyaguanxue.com;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://tianya-homepage:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name my.tianyaguanxue.com;

    ssl_certificate /etc/letsencrypt/live/my.tianyaguanxue.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.tianyaguanxue.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TIANYA_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://tianya-homepage:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
# END TIANYA HOMEPAGE
