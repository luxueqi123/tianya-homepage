proxy_cache_path /var/cache/nginx/tianya-image
    levels=1:2
    keys_zone=tianya_image:10m
    max_size=256m
    inactive=7d
    use_temp_path=off;

upstream tianya_homepage {
    server homepage:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name my.tianyaguanxue.com;

    client_max_body_size 10m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name my.tianyaguanxue.com;

    ssl_certificate /etc/letsencrypt/live/my.tianyaguanxue.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.tianyaguanxue.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TIANYA_SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location ^~ /_next/static/ {
        proxy_pass http://tianya_homepage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /_next/image {
        proxy_pass http://tianya_homepage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache tianya_image;
        proxy_cache_key "$scheme$host$request_uri|$http_accept";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header X-Image-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location ~* ^/(?:maps|milestones|photo-wall|project-cards|service-cards|social|travel)/.*\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        proxy_pass http://tianya_homepage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_max_temp_file_size 0;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location ~* \.(?:mp4|webm|mp3|m4a|aac|ogg)$ {
        proxy_pass http://tianya_homepage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        add_header Accept-Ranges bytes always;
    }

    location / {
        proxy_pass http://tianya_homepage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_max_temp_file_size 0;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
